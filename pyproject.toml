[project]
name = "gpt-2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "ipykernel>=7.4.0",
    "numpy>=2.5.3",
    "tiktoken>=0.14.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.19.0",
    "wandb>=0.30.0",
    "weave>=0.53.12",
]

[project.scripts]
gpt-2 = "gpt_2:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.basedpyright]
typeCheckingMode = "off"
